[licence_servers]
target-node ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[licence_servers:vars]
tomcat_home=/usr/local/tomcat
tomcat_user=tomcat
tomcat_group=tomcat
data_dir=/var/lib/licence
backup_dir=/opt/licence-backups
app_war=business-licence-renewal.war
health_endpoint=http://127.0.0.1:8080/business-licence-renewal/health
